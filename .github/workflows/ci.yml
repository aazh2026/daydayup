name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 类型检查 + 测试 + 构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与集成测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 检查构建产物
        run: test -f web/dist/index.html && echo "dist ok"

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: daydayup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
